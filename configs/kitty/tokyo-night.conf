# Tokyo Night - Kitty Minimal Config
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape     beam
cursor_blink_interval 0

window_padding_width 10
background_opacity   0.95
background_blur      1
hide_window_decorations yes
confirm_os_window_close 0

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #16161e
tab_bar_background      #16161e

background #1a1b26
foreground #c0caf5
selection_foreground #c0caf5
selection_background #364a82
cursor #c0caf5
cursor_text_color #1a1b26

# Normal
color0 #414868
color1 #f7768e
color2 #73daca
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #c0caf5

# Bright
color8  #414868
color9  #f7768e
color10 #73daca
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Workflow: Splits (Dikey Bolme), CWD, Broadcast
shell_integration enabled
enabled_layouts   splits,stack

map ctrl+shift+enter     launch --location=vsplit --cwd=current
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+z         toggle_layout stack
map ctrl+shift+alt+b     launch --allow-remote-control kitten broadcast --match-tab state:focused
